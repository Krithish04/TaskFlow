name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel outdated workflow runs on the same branch/PR to save CI runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Lint, Typecheck & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint static analysis
        run: npm run lint

  production-build:
    name: Next.js Production Build
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          AUTH_SECRET: ci-mock-secret-for-static-analysis-minimum-32-chars
          MONGODB_URI: mongodb://localhost:27017/taskflow-ci
        run: npm run build

  docker-validation:
    name: Docker Image Build Validation
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry run check)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: taskflow:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
