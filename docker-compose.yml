services:
  mongo:
    image: mongo:7.0
    container_name: taskflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: taskflow
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskflow-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      MONGODB_URI: mongodb://mongo:27017/taskflow
      AUTH_SECRET: ${AUTH_SECRET:-taskflow-devops-fallback-secret-min-32-chars}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - taskflow-network

volumes:
  mongo_data:
    driver: local

networks:
  taskflow-network:
    driver: bridge
